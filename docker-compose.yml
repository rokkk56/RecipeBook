services:
  postgres-db:
    container_name: recipebook-postgres
    image: postgres:18.3
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: recipebook
    volumes:
      - recipebook-data:/var/lib/postgresql
    ports:
      - "5434:5432"

volumes:
  recipebook-data: